spring:
  application:
    name: seyyah

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  # RestClient.Builder üzerinden OpenRouteService'e uygulanır
  http:
    client:
      connect-timeout: 5s
      read-timeout: 20s

ors:
  api:
    url: https://api.openrouteservice.org
    key: ${ORS_API_KEY}

jwt:
  gizli: ${JWT_SECRET}

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info

google:
  places:
    anahtar: ${GOOGLE_PLACES_API_KEY:}